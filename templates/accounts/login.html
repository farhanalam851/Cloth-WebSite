{% extends "base.html" %}
{% block title %}Login — ClothBrand{% endblock %}
{% block content %}
<div class="container my-5">
  <div class="card mx-auto" style="max-width: 420px;">
    <div class="card-body p-4">
      <h1 class="h5 mb-4">Login to your account</h1>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Username</label>
          {{ form.username }}
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          {{ form.password }}
        </div>
        {% if form.errors %}
          <div class="alert alert-danger py-2 small">Invalid username or password.</div>
        {% endif %}
        <button type="submit" class="btn btn-brand w-100">Login</button>
      </form>
      <p class="small text-muted mt-3 mb-0">No account? <a href="{% url 'accounts:register' %}">Register your business</a></p>
    </div>
  </div>
</div>
{% endblock %}
